services:
  web:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./env.primary
    environment:
      FLASK_ENV: production
      TZ: Asia/Shanghai
      APP_VERSION: ${APP_VERSION:-unknown}
      APP_BUILD_TIME: ${APP_BUILD_TIME:-unknown}
    ports:
      - "127.0.0.1:${PRIMARY_WEB_PORT:-5001}:5000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - primary_uploads:/app/static/images
      - primary_avatars:/app/static/avatars
      - ../logs-primary:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=4)"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 60s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    environment:
      WORKER_HOST: ${WORKER_HOST}
      WORKER_PORT: ${WORKER_PORT:-5000}
    ports:
      - "${PUBLIC_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/proxy_params:/etc/nginx/proxy_params:ro
    depends_on:
      web:
        condition: service_healthy

  db:
    image: mysql:8.0
    restart: unless-stopped
    env_file:
      - ./env.primary
    environment:
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max_connections=300
      - --skip-name-resolve
      - --innodb_buffer_pool_size=${MYSQL_BUFFER_POOL_SIZE:-1G}
    ports:
      - "${PRIMARY_LAN_IP}:3306:3306"
    volumes:
      - primary_db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    env_file:
      - ./env.primary
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - "${PRIMARY_LAN_IP}:6379:6379"
    volumes:
      - primary_redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 8

volumes:
  primary_db:
  primary_redis:
  primary_uploads:
  primary_avatars:
